name: Build Habits APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [habits-reminders]

permissions:
  contents: read

concurrency:
  group: habits-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Format changed Dart sources
        run: dart format lib/db/database.dart lib/db/tables.dart lib/main.dart lib/features/reminders lib/features/tracker_type/habit_edit_screen.dart test/reminder_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        timeout-minutes: 6
        run: flutter test --reporter expanded
      # Optional persistent development key. Without it each runner creates a
      # fresh debug key; see docs/habit-reminders.md before installing updates.
      - name: Restore development signing key
        if: github.event_name != 'pull_request'
        env:
          DEV_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEV_KEY" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEV_KEY" | base64 --decode > ~/.android/debug.keystore
          fi
      - name: Build installable development APK
        run: flutter build apk --debug
      - name: Android scheduling tests
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: didone-habits-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Upload generated source and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habits-validation
          path: |
            app/lib/db/database.g.dart
            app/lib/db/database.dart
            app/lib/db/tables.dart
            app/lib/main.dart
            app/lib/features/reminders/
            app/lib/features/tracker_type/habit_edit_screen.dart
            app/test/reminder_test.dart
            app/build/app/reports/tests/
